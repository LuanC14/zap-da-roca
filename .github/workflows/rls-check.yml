name: RLS check (production)

# Manual only. Creates two temporary users in the production project, verifies tenant isolation and
# the billing/OTP protections, then deletes them. Needs the project's service role key as a secret.
on:
  workflow_dispatch:

jobs:
  rls-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify tenant isolation
        run: node scripts/rls-check.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
